name: Android Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Capacitor Sync
        working-directory: frontend
        run: npx cap sync android

      - name: Decode and Inject Keystore
        working-directory: frontend/android/app
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_FILE_BASE64" ]; then
            echo "$KEYSTORE_FILE_BASE64" | base64 --decode > release.keystore
          else
            echo "Warning: KEYSTORE_FILE_BASE64 is not set."
          fi

      - name: Build Android Release (APK & AAB)
        working-directory: frontend/android
        env:
          CI: "true"
          KEYSTORE_FILE_PATH: "release.keystore"
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload APK & AAB to Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
          draft: true
          tag_name: ${{ github.ref_name }}
          name: "Omnidesk BD Android ${{ github.ref_name }} (Draft)"
          body: "Automated Android Release. APK for direct download, AAB for Play Store."
