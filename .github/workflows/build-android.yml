name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Capacitor Sync
        working-directory: frontend
        run: |
          npx cap sync android
          # Copy resources if needed, assuming cap sync does the job

      - name: Build Android APK (Release)
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          files: frontend/android/app/build/outputs/apk/release/*.apk
          draft: true
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          name: "Omnidesk BD ${{ github.ref_type == 'tag' && github.ref_name || 'Nightly Build' }}"
