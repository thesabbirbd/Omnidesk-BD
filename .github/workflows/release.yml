name: Desktop Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  frontend-checks:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Dependencies
        working-directory: frontend
        run: npm ci || npm install
        
      - name: Frontend Linting
        working-directory: frontend
        run: npm run lint
        
      - name: Frontend Typechecking
        working-directory: frontend
        run: npm run typecheck
        
      - name: Frontend Tests
        working-directory: frontend
        run: npm run test

  build-tauri:
    name: Build Desktop App
    needs: frontend-checks
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies (Linux only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
              build-essential curl wget libssl-dev libgtk-3-dev \
              libayatana-appindicator3-dev librsvg2-dev rpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Build Python Backend Sidecar
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --name backend --onefile --hidden-import="app" main.py
          mkdir -p ../src-tauri/bin
        shell: bash

      - name: Move Sidecar (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: mv backend/dist/backend src-tauri/bin/backend-x86_64-unknown-linux-gnu

      - name: Move Sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        run: mv backend/dist/backend.exe src-tauri/bin/backend-x86_64-pc-windows-msvc.exe

      - name: Build Tauri App
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Package & Checksum (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p artifacts
          
          find src-tauri/target/release/bundle/appimage -name "*.AppImage" -exec cp {} artifacts/Omnidesk-BD-v${VERSION}-linux-x64.AppImage \; || true
          find src-tauri/target/release/bundle -name "*.tar.gz" -exec cp {} artifacts/Omnidesk-BD-v${VERSION}-linux-x64.AppImage.tar.gz \; || true
          find src-tauri/target/release/bundle -name "*.tar.gz.sig" -exec cp {} artifacts/Omnidesk-BD-v${VERSION}-linux-x64.AppImage.tar.gz.sig \; || true
          find src-tauri/target/release/bundle -name "*.AppImage.sig" -exec cp {} artifacts/Omnidesk-BD-v${VERSION}-linux-x64.AppImage.sig \; || true
          find src-tauri/target/release/bundle/deb -name "*.deb" -exec cp {} artifacts/Omnidesk-BD-v${VERSION}-linux-x64.deb \; || true
          find src-tauri/target/release/bundle/rpm -name "*.rpm" -exec cp {} artifacts/Omnidesk-BD-v${VERSION}-linux-x64.rpm \; || true
          
          cd artifacts
          sha256sum * > checksums-linux.txt
        shell: bash

      - name: Package & Checksum (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          $VERSION = $env:GITHUB_REF_NAME.Substring(1)
          New-Item -ItemType Directory -Force -Path artifacts
          
          Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination "artifacts/Omnidesk-BD-v${VERSION}-windows-x64-setup.exe"
          }
          Get-ChildItem -Path src-tauri/target/release/bundle -Filter *.exe.zip -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination "artifacts/Omnidesk-BD-v${VERSION}-windows-x64-setup.exe.zip"
          }
          Get-ChildItem -Path src-tauri/target/release/bundle -Filter *.zip.sig -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination "artifacts/Omnidesk-BD-v${VERSION}-windows-x64-setup.exe.zip.sig"
          }
          Get-ChildItem -Path src-tauri/target/release/bundle -Filter *.exe.sig -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination "artifacts/Omnidesk-BD-v${VERSION}-windows-x64-setup.exe.sig"
          }
          
          Get-ChildItem -Path src-tauri/target/release/bundle/msi -Filter *.msi -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination "artifacts/Omnidesk-BD-v${VERSION}-windows-x64.msi"
          }
          
          cd artifacts
          $hash_content = ""
          Get-ChildItem -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $hash_content += "$hash  $($_.Name)`n"
          }
          Set-Content -Path checksums-windows.txt -Value $hash_content
        shell: pwsh


      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            artifacts/*
          draft: true
          tag_name: ${{ github.ref_name }}
          name: "Omnidesk BD ${{ github.ref_name }} (Draft Release)"
          body: "Automated desktop release. Please verify artifacts before publishing."

  publish-manifest:
    name: Generate Updater Manifest
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p downloaded_artifacts
          gh release download ${{ github.ref_name }} -D downloaded_artifacts --pattern "*.sig"
      - name: Generate Manifest
        run: node scripts/generate_manifest.js ${{ github.ref_name }} downloaded_artifacts
      - name: Upload Manifest
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: latest.json
          tag_name: ${{ github.ref_name }}
